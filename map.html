<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="/" aria-label="Psalt home"><span class="p">P</span>salt</a>
    <button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

    <nav class="nav" id="nav" aria-label="Main">

      <a class="btn small" href="/#beta">Join the beta</a>
    </nav>
  </div>
</header>
<main id="main">
<div class="map-page">
  <div id="map" role="region" aria-label="Map of Bible places"></div>
  <aside class="panel" aria-label="Places">
    <div class="panel-controls">
      <div class="row">
        <select id="book" aria-label="Book" style="flex:1"></select>
        <button class="icon-btn" id="key-btn" aria-expanded="false" aria-controls="key" title="About the pin colors">i</button>

      <input type="search" id="search" placeholder="Search for a place" aria-label="Search for a place" autocomplete="off">
      <div class="key" id="key" hidden></div>
    </div>
    <div class="panel-body" id="body"></div>
    <p class="credit-line">Place locations and confidence: <a href="https://www.openbible.info/geo/">OpenBible.info</a> (CC BY 4.0), compiled from over seventy modern scholarly sources. Map: OpenFreeMap, © OpenStreetMap contributors.</p>

</div>
</main>
